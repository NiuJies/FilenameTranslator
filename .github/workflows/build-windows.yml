name: Build Windows Test EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FilenameTranslator.csproj

      - name: Publish Windows x64
        run: dotnet publish FilenameTranslator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

      - name: Create ZIP
        shell: powershell
        run: Compress-Archive -Path publish\* -DestinationPath FilenameTranslator_Win10_Win11_x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilenameTranslator_Win10_Win11_x64
          path: FilenameTranslator_Win10_Win11_x64.zip
          if-no-files-found: error
